# Checks on every PR and on pushes to main/develop (issue #25).
#
# Three jobs, so the list of checks names the cause at a glance: `build` (lint, types, build, unit
# tests), `windows` (the unit tests on Windows) and `e2e` (a real `flotti run` with pretend agents,
# driven in Playwright's Chromium).
# Publishing to npm lives in publish.yml.

name: checks

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Unit tests on Windows: agents started through `.cmd` scripts, as `npx` and `codex` are
  # installed there (#57).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/test-results/
            test-results/
          if-no-files-found: ignore
